<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Corentin Ananas — Films de mariage</title>
<meta name="description" content="Espace privé des films de mariage.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css?v=20261110d">
</head>
<body class="portal-page">

<header class="portal__header">
  <p class="portal__brand">Corentin Ananas</p>
  <h1 class="portal__title">Vos films de mariage</h1>
  <p class="portal__subtitle">Choisissez votre mariage pour accéder à votre film.</p>
</header>

<main class="portal">
  <ul class="portal__grid" id="weddingGrid">
    <!-- Cards générées par js/portal.js à partir de js/weddings.js -->
  </ul>
</main>

<footer class="site-footer">
  <p class="site-footer__line">Espace privé — accès réservé aux invités.</p>
</footer>

<!-- ===================================================================
     MOT DE PASSE — s'ouvre au clic sur une card
==================================================================== -->
<div class="gate gate--modal is-hidden" id="gate" role="dialog" aria-modal="true" aria-labelledby="gateNames">
  <div class="gate__backdrop" id="gateBackdrop" aria-hidden="true"></div>
  <div class="gate__panel">
    <button type="button" class="gate__close" id="gateClose" aria-label="Fermer">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/>
      </svg>
    </button>
    <p class="gate__names" id="gateNames"></p>
    <time class="gate__date" id="gateDate"></time>
    <div class="gate__divider" aria-hidden="true"></div>
    <p class="gate__intro">Cet espace est réservé aux invités du mariage.</p>

    <form class="gate__form" id="gateForm" autocomplete="off">
      <label class="gate__label" for="gatePassword">Mot de passe</label>
      <div class="gate__field">
        <input
          type="password"
          id="gatePassword"
          name="password"
          class="gate__input"
          placeholder="••••••••"
          autocomplete="off"
          required
        >
        <button type="submit" class="gate__submit" id="gateSubmit" aria-label="Accéder au film">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <p class="gate__error" id="gateError" role="alert">Mot de passe incorrect. Merci de réessayer.</p>
      <p class="gate__hint">Le mot de passe vous a été communiqué avec l'invitation.</p>
    </form>
  </div>
</div>

<script src="js/weddings.js?v=20261110d"></script>
<script src="js/vault.js?v=20261110d"></script>
<script src="js/crypto.js?v=20261110d"></script>
<script src="js/portal.js?v=20261110d"></script>
</body>
</html>
